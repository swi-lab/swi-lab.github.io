# Lab members. One [table] per member; the table name is the member's id.
# Grouped by `role` on the People page (Principal Investigator, Postdoctoral
# Researchers, PhD Students, Master’s Students, ...). Within a role, members are
# sorted by the optional `order` number, then by name.
# Optional fields: order, bio, interests, image, url, urlLabel (defaults to Website).
# Portraits go in public/people/ and are referenced as /people/<file>.
# Each bio entry uses two lines: degree/field, then institution/year. Separate entries with a blank line.

[jiayun-wang]
name = "Jiayun Wang"
role = "Principal Investigator"
email = "pjwang@gatech.edu"
# Bio verified against https://pwang.pw/assets/pdf/CV.pdf; interests from the lab overview.
image = "/people/jiayun-wang.jpg"
url = "https://pwang.pw/"
bio = """
Postdoc
Caltech, 2025.

Ph.D.
UC Berkeley, 2023.
"""
interests = "Generative models, world models, agentic systems, inverse problems, medical imaging."

