# Lab members. One [table] per member; the table name is the member's id.
# Grouped by `role` on the People page (Principal Investigator, Postdoctoral
# Researchers, PhD Students, Master’s Students, ...). Within a role, members are
# sorted by the optional `order` number, then by name.
# Optional fields: order, bio, interests, image, url (personal site; links the member's name).
# Portraits go in src/assets/people/ and are referenced as ../assets/people/<file>;
# the build crops them to 4:5 and resizes them, so any reasonably sized photo works.
# Each bio entry uses two lines: title or degree + program, then school, institution and years. Separate entries with a blank line.
# Each member lists only their current position or program.
# Alumni (role = "Alumni") are listed compactly: no email or photo; `bio` is one line
# (their position while in the lab), plus optional `now` and `coadvisors`.

